# R-TEST-08 / R-SAVE-02: background the app, then kill it; the game comes back both times.
appId: com.asthachopa.app
---
- launchApp:
    clearState: true
- openLink: astha://debug/new?seed=61
- tapOn: "Throw"
- tapOn: "Throw again"
- tapOn: "Red pawn 1, waiting on the start square"
# Background and return: still on the game screen.
- pressKey: Home
- launchApp:
    stopApp: false
- assertVisible: "Red pawn 1, square 1, outer ring"
# Kill and relaunch: Home offers Continue game and restores the same position.
- stopApp
- launchApp:
    clearState: false
- tapOn: "Continue game"
- assertVisible: "Red pawn 1, square 1, outer ring"
- assertVisible: "Throw of 3"
