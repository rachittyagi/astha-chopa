# R-TEST-08: start a 2-player game and play one turn.
# Seed 61 throws 8, then 3: enter a pawn with the 8 and move it 3 squares.
appId: com.asthachopa.app
---
- launchApp:
    clearState: true
- openLink: astha://debug/new?seed=61
- assertVisible: "Your turn"
- tapOn: "Throw"
- assertVisible: "Ashta! Throw again"
- tapOn: "Throw again"
- assertVisible: "Tap your waiting pawns on the start square to bring one in"
- tapOn: "Red pawn 1, waiting on the start square"
- tapOn: "Red pawn 1, square 1, outer ring"
- assertVisible: "Red pawn 1, square 4, outer ring"
- assertVisible: "Player 3"
