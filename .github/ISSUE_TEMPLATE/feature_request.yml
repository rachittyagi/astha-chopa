name: Feature request
description: Suggest a new feature or rule option
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like?
      description: The feature or rule variant, and who it helps.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: How it should work. For rule variants, where it is played this way.
