name: Bug report
description: Something in the game or the rules does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a 2-player game with ...
        2. Throw ...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: e.g. Pixel 7, Android 15
  - type: input
    id: version
    attributes:
      label: App version or commit
  - type: textarea
    id: rules
    attributes:
      label: Rule settings
      description: The rule options in use (Players & rules screen), if it is a rules problem.
